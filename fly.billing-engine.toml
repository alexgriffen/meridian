# Cron loop that generates invoices. Internal-only, no public IP.
app = "meridian-billing"
primary_region = "sjc"

[build]
  dockerfile = "services/billing-engine/Dockerfile"

[env]
  CYCLE_INTERVAL_MS = "30000"
  LOG_LEVEL = "info"
  OTEL_SDK_DISABLED = "true"

# Always-on worker — no http_service block, no auto-stop.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
