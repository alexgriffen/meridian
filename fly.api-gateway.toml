# Public REST API. Only service with a public IP in the Fly deployment.
app = "meridian-gateway"
primary_region = "sjc"

[build]
  dockerfile = "services/api-gateway/Dockerfile"

[env]
  AUTH_MODE = "dev"
  LOG_LEVEL = "info"
  PORT = "4000"
  OTEL_SDK_DISABLED = "true"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
